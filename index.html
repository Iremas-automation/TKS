<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektų centras · Projektų seka</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
<style>
:root{
  --ink:#14181C;--steel-900:#1B2128;--steel-800:#262E37;--steel-700:#37414D;--steel-500:#69747F;
  --steel-400:#95A0AB;--steel-300:#C3CACF;--steel-100:#E7EAED;--paper:#EDF0F2;--panel:#FFFFFF;--line:#DBE0E5;
  --blue:#1E5E8C;--blue-deep:#123A57;--green:#2E8B57;--amber:#C08422;--red:#C03A2B;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}html,body{margin:0;height:100%;}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;min-height:100vh;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--steel-500);}
.muted{color:var(--steel-500);}svg{display:block;}.neg{color:var(--red);font-weight:700;}.pos{color:var(--green);font-weight:700;}

/* login screen */
.gate{min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 0%,#20303c 0%,#161d24 60%);padding:24px;}
.gate-card{width:100%;max-width:400px;background:var(--panel);border-radius:12px;padding:34px 30px;box-shadow:0 24px 70px rgba(8,14,20,.4);text-align:center;}
.gate-mark{width:52px;height:52px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;margin:0 auto 16px;}
.gate h1{font-size:20px;font-weight:800;letter-spacing:.03em;margin:0 0 4px;}
.gate p{font-size:13px;color:var(--steel-500);margin:0 0 22px;line-height:1.55;}
.msbtn{display:inline-flex;align-items:center;gap:10px;background:#2F2F2F;color:#fff;border:none;border-radius:6px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.msbtn:hover{background:#000;}
.gate-note{margin-top:20px;font-size:11px;color:var(--steel-400);line-height:1.5;}
.spin{width:26px;height:26px;border:3px solid var(--steel-100);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto;}
@keyframes sp{to{transform:rotate(360deg);}}

.banner{padding:12px 18px;font-size:13px;display:flex;gap:10px;align-items:flex-start;}
.banner.err{background:rgba(192,58,43,.08);color:#8f271b;border-bottom:1px solid rgba(192,58,43,.25);}
.banner.warn{background:rgba(192,132,34,.1);color:#845611;border-bottom:1px solid rgba(192,132,34,.3);}
.banner code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:3px;}

.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--steel-900);color:#fff;padding:0 18px;min-height:60px;flex:none;gap:14px;flex-wrap:wrap;}
.brand{display:flex;gap:11px;align-items:center;}
.mark{width:34px;height:34px;border-radius:5px;background:var(--blue);display:grid;place-items:center;color:#fff;}
.b-t{font-weight:800;letter-spacing:.06em;font-size:13.5px;}.b-s{font-size:11px;color:var(--steel-400);}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab{display:inline-flex;align-items:center;gap:7px;background:transparent;border:none;color:var(--steel-300);font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 13px;border-radius:5px;cursor:pointer;}
.tab:hover{background:var(--steel-800);color:#fff;}.tab.on{background:var(--blue);color:#fff;}
.me{display:flex;align-items:center;gap:10px;}
.me .who{text-align:right;line-height:1.2;}.me .who .nm{font-size:12.5px;font-weight:600;}
.rolechip{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#bcd6ea;}
.signout{background:var(--steel-800);color:var(--steel-300);border:1px solid var(--steel-700);border-radius:5px;font-size:11.5px;padding:6px 10px;cursor:pointer;}
.signout:hover{color:#fff;}

.body{flex:1;overflow:auto;}
.pane{padding:22px 32px 40px;}
.pane-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
.pane-head h1{font-size:22px;font-weight:750;letter-spacing:-.01em;margin:7px 0 0;}
.kpis{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.kpis .sel,.kpis .btn{height:38px;display:inline-flex;align-items:center;}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar #proj-q{flex:1 1 220px;min-width:180px;max-width:360px;height:38px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 16px;text-align:center;}
.kpi.warn{border-color:rgba(192,58,43,.35);background:rgba(192,58,43,.05);}
.kpi-n{display:block;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--blue-deep);}
.kpi.warn .kpi-n{color:var(--red);}.kpi-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel-500);font-weight:600;}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}.fl{display:flex;flex-direction:column;gap:5px;}.fl .sel{min-width:180px;}

.ava{width:26px;height:26px;border-radius:6px;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none;}
.avarow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.track{display:block;height:7px;background:var(--steel-100);border-radius:2px;overflow:hidden;}.track.lg{height:9px;}
.fill{display:block;height:100%;}.fill.wip{background:var(--blue);}.fill.done{background:var(--green);}.fill.over{background:var(--red);}
.dl{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:3px;white-space:nowrap;}
.dl-green{background:rgba(46,139,87,.12);color:#217a4a;}.dl-amber{background:rgba(192,132,34,.15);color:#8f6015;}.dl-red{background:rgba(192,58,43,.12);color:#9c2c1f;}.dl-grey{background:var(--steel-100);color:var(--steel-500);}

.mcards{display:flex;flex-direction:column;gap:10px;}
.mcard{display:grid;grid-template-columns:120px 1fr 150px;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel-300);border-radius:8px;padding:15px 18px;}
.mcard.mc-red{border-left-color:var(--red);}.mcard.mc-amber{border-left-color:var(--amber);}.mcard.mc-green{border-left-color:var(--green);}.mcard.mc-grey{border-left-color:var(--steel-300);}
.mcard[data-act]{cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.mcard[data-act]:hover{border-color:var(--steel-400);box-shadow:0 2px 6px rgba(20,30,40,.07);}
.mc-nrbox{text-align:center;border-right:1px solid var(--line);padding-right:16px;}
.mc-nrlab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-400);font-weight:700;}
.mc-nrnum{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.05;color:var(--blue-deep);word-break:break-all;}
.mc-badge{display:inline-block;margin-top:9px;}.mc-body{min-width:0;}
.mc-proj{font-size:15px;font-weight:700;line-height:1.25;margin-bottom:3px;}
.mc-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--steel-500);margin-bottom:10px;flex-wrap:wrap;}
.mc-hours{display:flex;gap:22px;flex-wrap:wrap;font-size:11.5px;color:var(--steel-500);margin-bottom:9px;}
.mc-hours span{display:flex;flex-direction:column;gap:1px;}.mc-hours b{color:var(--ink);font-size:14px;font-weight:700;}
.mc-act{display:flex;justify-content:flex-end;}.mc-open{font-size:12.5px;color:var(--blue);font-weight:700;white-space:nowrap;}

.backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--steel-500);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px;}
.backbtn:hover{color:var(--ink);}
.dhead{display:flex;justify-content:space-between;gap:26px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;margin-bottom:18px;}
.dhead h1{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:2px 0 10px;max-width:620px;line-height:1.25;}
.prnr{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:var(--blue);padding:3px 9px;border-radius:4px;letter-spacing:.03em;}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}.mi{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--steel-600);}
.dot{width:3px;height:3px;border-radius:50%;background:var(--steel-300);}
.readout{min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px 16px;}
.ro-lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--steel-500);margin-bottom:8px;}
.ro-row{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);margin-bottom:10px;}
.ro-n{font-size:26px;font-weight:700;color:var(--blue-deep);}.ro-sep{font-size:18px;color:var(--steel-300);}.ro-e{font-size:18px;color:var(--steel-500);}
.ro-foot{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--steel-500);margin-top:9px;}.ro-foot.neg{color:var(--red);font-weight:700;}
.section{margin-bottom:22px;}.sec-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tasks{display:flex;flex-direction:column;gap:7px;}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;border-left:3px solid var(--blue);}
.task .tk-txt{font-size:13px;font-weight:600;flex:1;}.task .tk-due{font-family:var(--mono);font-size:12px;}
.tk-del{color:var(--steel-400);cursor:pointer;display:grid;place-items:center;}.tk-del:hover{color:var(--red);}
.tk-done-btn{display:grid;place-items:center;width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--steel-400);cursor:pointer;flex:none;}
.tk-done-btn:hover{color:var(--green);border-color:rgba(46,139,87,.4);}
.task.done{opacity:.62;}.task.done .tk-txt{text-decoration:line-through;}
.task.done .tk-done-btn{background:rgba(46,139,87,.14);color:var(--green);border-color:rgba(46,139,87,.4);}
.grouphdr{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:#EEF2F5;border-bottom:1px solid var(--line);border-top:1px solid var(--line);border-left:4px solid var(--blue);padding:8px 12px 8px 10px;font-size:12px;font-weight:700;color:var(--steel-700);position:sticky;left:0;}
.grouphdr .gh-nr{font-family:var(--mono);color:#fff;background:var(--blue);padding:2px 7px;border-radius:4px;font-size:11px;}
.ghliko{margin-left:10px;font-size:11px;font-weight:700;color:var(--steel-600);}.ghliko.neg{color:var(--red);}
.ptblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);}
.ptbl{min-width:860px;}
.prowh,.prow{display:grid;grid-template-columns:70px minmax(180px,2fr) minmax(130px,1.2fr) 150px 100px minmax(170px,1.5fr) 34px;align-items:center;}
.statcell{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.warnmark{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;flex:none;}
.prowh{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-500);font-weight:700;border-bottom:1px solid var(--line);}
.prowh>span{padding:9px 12px;}
.prow{border-bottom:1px solid var(--line);cursor:pointer;transition:background .08s;}
.prow:last-child{border-bottom:none;}
.prow:hover{background:#F6F8FA;}
.prow>span{padding:11px 12px;font-size:13px;}
.prow .nr{font-family:var(--mono);font-weight:700;color:var(--blue-deep);}
.prow .pname{font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.avarow.sm .av{width:21px;height:21px;font-size:9px;}
.pprog{display:flex;align-items:center;gap:8px;}.pprog .track{flex:1;min-width:54px;}.pprog small{font-size:11px;white-space:nowrap;}
.pgh{display:flex;align-items:center;gap:9px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#EEF2F5;border-top:1px solid var(--line);border-left:4px solid var(--blue);color:var(--steel-700);}
.pgh .pgh-car{font-size:10px;color:var(--steel-500);width:10px;}
.pgh .cnt{color:var(--steel-500);font-weight:600;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 8px;}
.pgh.tone-red{border-left-color:var(--red);}.pgh.tone-amber{border-left-color:#C98A1A;}.pgh.tone-green{border-left-color:var(--green);}.pgh.tone-blue{border-left-color:var(--blue);}.pgh.tone-grey{border-left-color:var(--steel-400);}
.absrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.absbtn{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;cursor:pointer;color:var(--steel-700);}
.absbtn:hover{border-color:var(--blue);}
.absbtn.clear{margin-left:auto;background:#F5F7F8;}
.absbtn.on.abs-A{background:#3E7CB1;border-color:#3E7CB1;color:#fff;}
.absbtn.on.abs-L{background:#C0533F;border-color:#C0533F;color:#fff;}
.absbtn.on.abs-K{background:#7A5AA6;border-color:#7A5AA6;color:#fff;}
.hc.abs{font-weight:800;color:#fff;}
.hc.abs-A{background:#3E7CB1;}.hc.abs-L{background:#C0533F;}.hc.abs-K{background:#7A5AA6;}
.abs-chip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;color:#fff;font-size:10px;font-weight:800;margin-right:4px;}
.abs-chip.abs-A{background:#3E7CB1;}.abs-chip.abs-L{background:#C0533F;}.abs-chip.abs-K{background:#7A5AA6;}
.statseg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px;flex-wrap:wrap;}
.segbtn{padding:9px 16px;font-size:13px;font-weight:600;background:var(--panel);color:var(--steel-600);border:none;border-right:1px solid var(--line);cursor:pointer;}
.segbtn:last-child{border-right:none;}
.segbtn:hover{background:#F6F8FA;}
.segbtn.on{background:var(--blue);color:#fff;}
.warnbar{padding:10px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin-top:10px;}
.warnbar.red{background:rgba(192,58,43,.1);color:var(--red);border:1px solid rgba(192,58,43,.3);}
.warnbar.amber{background:rgba(201,138,26,.12);color:#8a5f12;border:1px solid rgba(201,138,26,.32);}
.warnbar.green{background:rgba(46,139,87,.09);color:var(--green);border:1px solid rgba(46,139,87,.28);}
.dsum{grid-template-columns:minmax(140px,2fr) 140px 100px 100px 100px;}
.dsum-tot{background:#F5F7F8;}
.dsum-tot:hover{background:#F5F7F8;}
.svwt .prowh,.svwt .prow{grid-template-columns:minmax(120px,1.3fr) 128px 90px 90px minmax(200px,2.2fr);}
.svwrow{cursor:default;}.svwrow:hover{background:transparent;}
.svw-asg{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;}
.pill.red{background:var(--red);}.pill.amber{background:#C98A1A;}.pill.green{background:var(--green);}.pill.blue{background:var(--blue);}.pill.grey{background:var(--steel-400);}
.monthnav{display:flex;align-items:center;gap:8px;margin-left:auto;}.monthnav .mlabel{font-size:13px;font-weight:700;color:var(--steel-700);text-transform:capitalize;min-width:120px;text-align:center;}
.stage-ed{border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:10px;background:#FAFBFC;}
.stage-ed .ed-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.stage-ed .ed-idx{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--steel-500);}
.stage-ed .ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stage-ed .ed-lab{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel-500);font-weight:700;margin-bottom:4px;display:block;}
.stg-edit{color:var(--steel-400);cursor:pointer;display:inline-grid;place-items:center;margin-left:6px;vertical-align:-3px;}.stg-edit:hover{color:var(--blue);}
.adm{grid-template-columns:minmax(150px,1.5fr) minmax(170px,1.6fr) 120px 78px 82px 150px 62px;}
.team2{grid-template-columns:80px 1.6fr 1.4fr 90px 46px;}
.svsub{grid-template-columns:minmax(150px,2fr) 70px 160px 100px 100px;}
.svpart{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--panel);}
.svp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.svp-top .gh-nr{font-family:var(--mono);color:#fff;background:var(--blue);padding:2px 7px;border-radius:4px;font-size:11px;}
.svp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.svp-assignees{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.asg{display:inline-flex;align-items:center;gap:6px;background:var(--steel-100);border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 3px;font-size:12px;cursor:pointer;}
.asg:hover{border-color:var(--blue);}
.asg b{font-family:var(--mono);color:var(--blue-deep);}
.asg-x{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--steel-200);color:var(--steel-600);font-size:13px;line-height:1;cursor:pointer;}
.asg-x:hover{background:var(--red);color:#fff;}
.tabchips{display:flex;gap:3px;flex-wrap:wrap;}
.tabchip{font-size:9.5px;font-weight:700;background:var(--steel-100);color:var(--steel-600);padding:2px 5px;border-radius:3px;white-space:nowrap;}
.chkgrid{display:flex;flex-direction:column;gap:7px;}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;}
.chk input{width:16px;height:16px;flex:none;}
.gtbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);}
.gr{display:grid;gap:12px;align-items:center;padding:0 14px;}
.gr.th{min-height:36px;padding-top:9px;padding-bottom:9px;background:#F5F7F8;border-bottom:1px solid var(--line);}
.gr.th span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--steel-500);}
.gr.row{border-top:1px solid var(--line);min-height:46px;transition:background .08s;}.gtbl>.gr.row:first-of-type{border-top:none;}
.gr.row:hover{background:#F6F8FA;}
.gr .r{text-align:right;justify-content:flex-end;display:flex;align-items:center;gap:5px;}
.gr .who{display:flex;align-items:center;gap:8px;font-size:12.5px;}.gr .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stg{grid-template-columns:minmax(160px,2fr) 230px 88px 84px 82px minmax(110px,1fr);}
.rev{grid-template-columns:1fr 100px 120px 36px;}.disc{grid-template-columns:minmax(150px,2fr) 100px 100px 100px 110px;}
.mysum{grid-template-columns:minmax(160px,2fr) 118px 118px 100px 128px;}
.grp-sub{padding:7px 14px;background:#EEF2F7;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--steel-500);border-top:1px solid var(--line);}
.psum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 18px;}
.pcard .pl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel-500);font-weight:700;margin-bottom:6px;}
.pcard .pv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--blue-deep);}
.pcard.profit{border-color:rgba(46,139,87,.4);background:rgba(46,139,87,.05);}.pcard.profit .pv{color:var(--green);}
.pcard.loss{border-color:rgba(192,58,43,.4);background:rgba(192,58,43,.05);}.pcard.loss .pv{color:var(--red);}

function roleKey(r){ r=(r||"").toLowerCase(); if(r.indexOf("admin")>=0)return "ADMIN"; if(r.indexOf("vadov")>=0&&r.indexOf("skyr")<0||r==="pv")return "PV"; if(r.indexOf("virš")>=0||r.indexOf("virs")>=0||r==="sv")return "SV"; return "PROJ"; }

var TAB_LT={projektai:"Projektai",mine:"Mano projektai",svwork:"Skyriaus darbai",pelningumas:"Pelningumas",stats:"Statistika",admin:"Administravimas"};

var PEOPLE=[], SKYRIAI=[], PROJECTS=[];

            selId:null, pelId:null, me:null, meEmail:null,

function person(n){return PEOPLE.find(function(p){return p.name===n;});}
function personByEmail(e){e=(e||"").toLowerCase();return PEOPLE.find(function(p){return (p.email||"").toLowerCase()===e;});}
function prettyEmail(e){e=(e||"").split("@")[0];if(!e)return "—";return e.split(/[._\-]+/).filter(Boolean).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");}
function nameOf(email){var pe=personByEmail(email);return pe?pe.name:(email?prettyEmail(email):"—");}
function pmName(p){return nameOf(p.pm);}
function hueOf(n){var p=person(n);return p?p.hue:210;}
function rateOf(n){var p=person(n);return p?p.rate:230;}
function roleOf(n){var p=person(n);return p?p.role:"PROJ";}
function avatar(n){return '<i class="ava" style="background:hsl('+hueOf(n)+' 42% 42%)" title="'+esc(n)+'">'+initials(n)+'</i>';}
function skyriusName(code){var s=SKYRIAI.find(function(x){return x.code===code;});return s?s.name:code;}
function skyriusRate(code){var s=SKYRIAI.find(function(x){return x.code===code;});return s?s.rate:230;}
/* dalis yra PASLAUGA (ne skyrius/disciplina), jei jos kodas neatitinka jokio skyriaus — tada kodas = paslaugos pavadinimas */
function isSvc(code){return !!code&&!SKYRIAI.some(function(x){return x.code===code;});}
/* dalis IŠORINĖ (neplanuojama viduje, neskiriama projektuotojams): paslauga arba pažymėta „subranga" */
function isExternal(s){return !!s&&(s.sub||isSvc(s.code));}
function myRole(){return state.me?roleOf(state.me):"PROJ";}
function canManage(){var r=myRole();return r==="PV"||r==="SV"||r==="ADMIN";}
function canAdmin(){return myTabKeys().indexOf("admin")>=0;}

/* mapina žalius sąrašų įrašus į programos struktūrą */
function assemble(raw){
  PEOPLE = raw.darbuotojai.map(function(f,i){
    var _dp=String(f.Skyrius||"").split(/[,;]+/).map(function(s){return s.trim();}).filter(Boolean);
    return { name:F(f,"Vardas"), email:(f.ElPastas||"").toLowerCase(), role:roleKey(f.Role), roleRaw:f.Role||"",
             depts:_dp, dept:_dp.join(", "), rate:numOr(f.DienosIkainis,230),
             tabs:String(f.Skiltys||"").split(",").map(function(s){return s.trim();}).filter(Boolean),
             inStats:(function(){var s=String(f.Statistikoje||"").toLowerCase();return s?(s.indexOf("taip")>=0||s==="1"||s==="true"||s==="yes"):(roleKey(f.Role)!=="ADMIN");})(),
             inProjects:(function(){var s=String(f.Projektuose||"").toLowerCase();return s?(s.indexOf("taip")>=0||s==="1"||s==="true"||s==="yes"):(roleKey(f.Role)!=="ADMIN");})(),
             hue:(i*47+200)%360, spId:f.__id };
  });
  SKYRIAI = raw.skyriai.map(function(f){
    return { code:F(f,"Kodas"), name:f.Pavadinimas||F(f,"Kodas"), head:(f.VadovoElPastas||"").toLowerCase(), rate:numOr(f.DienosIkainis,230), spId:f.__id };
  });
  var dalysBy={}, tasksBy={}, revBy={}, subBy={}, prisBy={};
  raw.dalys.forEach(function(f){ var pn=F(f,"ProjektoNr"); (dalysBy[pn]=dalysBy[pn]||[]).push(f); });
  raw.uzduotys.forEach(function(f){ var pn=F(f,"ProjektoNr")||f.ProjektoNr; (tasksBy[pn]=tasksBy[pn]||[]).push(f); });
  raw.sutartys.forEach(function(f){ var pn=F(f,"ProjektoNr"); (revBy[pn]=revBy[pn]||[]).push(f); });
  raw.subrangai.forEach(function(f){ var pn=F(f,"ProjektoNr"); (subBy[pn]=subBy[pn]||[]).push(f); });
  raw.priskyrimai.forEach(function(f){ var k=F(f,"ProjektoNr")+"|"+(f.SkyriausKodas); (prisBy[k]=prisBy[k]||[]).push({email:(f.DarbuotojoElPastas||"").toLowerCase(),hours:Number(f.PlanuotosValandos)||0,spId:f.__id}); });

  PROJECTS = raw.projektai.map(function(f){
    var pn=F(f,"ProjektoNr");
    var stages=(dalysBy[pn]||[]).map(function(d){
      var code=d.SkyriausKodas, pris=(prisBy[pn+"|"+code]||[]).map(function(x){var pe=personByEmail(x.email);return {email:x.email,name:pe?pe.name:x.email,hours:x.hours,spId:x.spId};});
      var emails=pris.map(function(x){return x.email;});
      var respName=null; if(emails.length){ var pe=personByEmail(emails[0]); respName=pe?pe.name:null; }
      return { code:code, name:skyriusName(code), soldDays:Number(d.ParduotosDienos)||0,
               soldPrice:(d.ParduotaKaina!=null?Number(d.ParduotaKaina):null), rate:skyriusRate(code),
               deadline:dOnly(d.DaliesTerminas), resp:respName, assignees:emails, pris:pris, prisIds:pris.map(function(x){return x.spId;}),
               sub:(String(d.Subranga||"").toLowerCase().indexOf("taip")>=0)||d.Subranga===true, spId:d.__id };
    });
    return { id:pn, name:f.Pavadinimas||pn, deadline:dOnly(f.Terminas),
             status:((f.Busena||"").toLowerCase().indexOf("uždar")>=0||(f.Busena||"").toLowerCase().indexOf("uzdar")>=0)?"closed":"active",
             pm:(f.VadovoElPastas||"").toLowerCase(),
             tasks:(tasksBy[pn]||[]).map(function(t){var ae=(t.Vykdytojas||"").toLowerCase();var pe=ae?personByEmail(ae):null;var done=(String(t.Atlikta||"").toLowerCase().indexOf("taip")>=0)||t.Atlikta===true;return {text:F(t,"Uzduotis"),due:dOnly(t.Terminas),assignee:ae,assigneeName:pe?pe.name:"",done:done,spId:t.__id};}),
             revenue:(revBy[pn]||[]).map(function(r){return {title:F(r,"Sutartis"),date:dOnly(r.Data),sum:Number(r.SumaBePVM)||0,spId:r.__id};}),
             subrangai:(subBy[pn]||[]).map(function(r){return {title:F(r,"Tiekejas"),date:dOnly(r.Data),sum:Number(r.SumaBePVM)||0,code:(r.SkyriausKodas||"").trim()||null,spId:r.__id};}),
             stages:stages, spId:f.__id };
  });
  var rawRegs = raw.darboLaikas.map(function(f){
    var pe=personByEmail(f.DarbuotojoElPastas); 
    return { who:pe?pe.name:(f.DarbuotojoElPastas||""), whoEmail:(f.DarbuotojoElPastas||"").toLowerCase(),
             pid:F(f,"ProjektoNr"), code:f.SkyriausKodas, date:dOnly(f.Data), hours:Number(f.Valandos)||0, spId:f.__id };
  });
  // Apsauga: jei „DarboLaikas" sąraše liko dublių tam pačiam žmogui/projektui/daliai/dienai
  // (susikaupę po ankstesnių versijų), paliekam paskutinį — kad statistika atitiktų vieno langelio vieną reikšmę.
  var seen={}; state.regs=[];
  for(var ri=rawRegs.length-1; ri>=0; ri--){ var r=rawRegs[ri]; var k=r.whoEmail+"|"+r.pid+"|"+r.code+"|"+r.date;
    if(seen[k]) continue; seen[k]=1; state.regs.unshift(r); }
  state.absences=(raw.nebuvimai||[]).map(function(f){return {email:(F(f,"DarbuotojoElPastas")||"").toLowerCase(),date:dOnly(f.Data),type:(f.Tipas||"").trim().toUpperCase().slice(0,1),spId:f.__id};}).filter(function(a){return a.email&&a.date&&a.type;});
  absMap={}; state.absences.forEach(function(a){absMap[a.email+"|"+a.date]=a;});
  // daliai priskirtos subrangos: paskaičiuojam, kiek € ir kiek dienų atimti iš dalies parduoto biudžeto
  PROJECTS.forEach(function(p){(p.stages||[]).forEach(function(s){
    var ss=(p.subrangai||[]).reduce(function(a,r){return a+((r.code&&r.code===s.code)?(r.sum||0):0);},0);
    s.subSum=ss; s.subDays=(s.rate>0?ss/s.rate:0);
  });});
}
var absMap={};
var ABS_LT={A:"Atostogos",L:"Liga / nedarbingumas",K:"Komandiruotė"};
function absenceOf(email,date){var a=absMap[(email||"").toLowerCase()+"|"+date];return a?a.type:null;}
function myAbsence(date){return absenceOf(state.meEmail,date);}

/* ---------------- skaičiavimai ---------------- */
function stageSpent(pid,code){return state.regs.reduce(function(a,r){return a+((r.pid===pid&&r.code===code)?r.hours:0);},0);}
/* planuojamos dienos (val.) = parduotos dienos − daliai priskirtos subrangos dienos; subranga/paslauga viduje neplanuojama (0) */
function stagePlanned(s){if(s&&s.sub)return 0;var d=(s.soldDays||0)-(s.subDays||0);return (d>0?d:0)*CAP;}
function stageCost(p,s){return state.regs.reduce(function(a,r){return a+((r.pid===p.id&&r.code===s.code)?(r.hours/CAP)*rateOf(r.who):0);},0);}
function totals(p){var pl=0,sp=0;p.stages.forEach(function(s){pl+=stagePlanned(s);sp+=stageSpent(p.id,s.code);});return {planned:pl,spent:sp,left:pl-sp};}
/* subrangos, priskirtos konkrečiai daliai (pagal SkyriausKodas), suma € */
function stageSubSum(p,code){var st=(p.stages||[]).find(function(s){return s.code===code;});if(st&&st.subSum!=null)return st.subSum;return (p.subrangai||[]).reduce(function(a,r){return a+((r.code&&r.code===code)?(r.sum||0):0);},0);}
/* dalies bendra parduota suma: tiesiogiai įrašyta suma, arba (dienų režime) dienos × įkainis */
function soldSum(p,s){if(s.soldPrice!=null)return s.soldPrice;var d=s.soldDays||0;return d>0?d*(s.rate||0):null;}
/* dalies parduotas biudžetas sumažinamas subrangos suma (daliai priskirta subranga) */
function soldPriceEff(p,s){var base=soldSum(p,s);if(base==null)return null;var r=base-(s.subSum||0);return r<0?0:r;}
function soldDaysEff(p,s){var dd=(s.soldDays||0)-(s.subDays||0);return dd<0?0:dd;}
/* perskaičiuoja dalims priskirtų subrangų sumas/dienas (po pridėjimo/šalinimo be perkrovimo) */
function recalcStageSub(p){(p.stages||[]).forEach(function(s){var ss=(p.subrangai||[]).reduce(function(a,r){return a+((r.code&&r.code===s.code)?(r.sum||0):0);},0);s.subSum=ss;s.subDays=(s.rate>0?ss/s.rate:0);});}
function workdaysUntil(dstr){ if(!dstr)return null; var end=new Date(dstr); if(isNaN(end))return null; if(isoD(end)<isoD(today))return 0; var n=0,d=addDays(today,1); while(isoD(d)<=isoD(end)){ var w=d.getDay(); if(w!==0&&w!==6)n++; d=addDays(d,1);} return n; }
/* projektas rizikuoja: bent vienai daliai liko daugiau darbo (d.) nei darbo dienų iki jos termino */
function projectRisk(p){ if(p.status==="closed"||!p.deadline)return false;
  return (p.stages||[]).some(function(s){ var rem=(stagePlanned(s)-stageSpent(p.id,s.code))/CAP; if(rem<=0)return false; var wd=workdaysUntil(s.deadline||p.deadline); return wd!==null&&rem>wd; }); }
function deptSummary(){
  var map={},mStart=new Date(today.getFullYear(),today.getMonth(),1),mEnd=new Date(today.getFullYear(),today.getMonth()+1,1);
  PROJECTS.filter(function(p){return p.status!=="closed";}).forEach(function(p){
    (p.stages||[]).forEach(function(s){
      if(isExternal(s))return; // paslaugos ir subranga nėra skyriaus apkrova
      var m=map[s.code]||(map[s.code]={code:s.code,name:skyriusName(s.code),sold:0,worked:0,month:0});
      var h=soldDaysEff(p,s)*CAP; m.sold+=h; m.worked+=stageSpent(p.id,s.code);
      var dd=s.deadline||p.deadline; if(dd){var dt=new Date(dd); if(dt>=mStart&&dt<mEnd)m.month+=h;}
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.sold-a.sold;});
}
function deptSummaryTable(){
  var rows=deptSummary(); if(!rows.length)return '';
  var tot={month:0,sold:0,worked:0};rows.forEach(function(r){tot.month+=r.month;tot.sold+=r.sold;tot.worked+=r.worked;});
  var body=rows.map(function(r){var lik=r.sold-r.worked;return '<div class="gr row dsum"><span style="font-weight:600;font-size:12.5px">'+esc(r.name||r.code)+'</span><span class="r mono">'+nfD(r.month)+' d.</span><span class="r mono">'+nfD(r.sold)+' d.</span><span class="r mono">'+nfD(r.worked)+' d.</span><span class="r mono '+(lik<0?"neg":"")+'">'+nfD(lik)+' d.</span></div>';}).join("");
  body+='<div class="gr row dsum dsum-tot"><span style="font-weight:700;font-size:12.5px">Iš viso</span><span class="r mono">'+nfD(tot.month)+' d.</span><span class="r mono">'+nfD(tot.sold)+' d.</span><span class="r mono">'+nfD(tot.worked)+' d.</span><span class="r mono '+((tot.sold-tot.worked)<0?"neg":"")+'">'+nfD(tot.sold-tot.worked)+' d.</span></div>';
  var nPeople=PEOPLE.filter(function(p){return p.inProjects;}).length;
  var wdMonth=monthWorkdays(0).length;
  var capH=nPeople*wdMonth*CAP;
  var capPct=capH?tot.month/capH:0;
  var capTone=capPct>1?"red":capPct>=0.85?"amber":"green";
  var capMsg=capPct>1?("⚠ Šį mėn. parduota "+nfD(tot.month)+" d., o skyrių pajėgumas tik "+nfD(capH)+" d. ("+nPeople+" darb. × "+wdMonth+" d. d.) — pajėgumas viršytas.")
    :capPct>=0.85?("⚠ Beveik pilna: šį mėn. parduota "+nfD(tot.month)+" d. iš "+nfD(capH)+" d. pajėgumo ("+Math.round(capPct*100)+"%).")
    :("Pajėgumas šį mėn.: parduota "+nfD(tot.month)+" d. iš "+nfD(capH)+" d. ("+nPeople+" darb. × "+wdMonth+" d. d., "+Math.round(capPct*100)+"%).");
  var atRisk=PROJECTS.filter(function(p){return projectRisk(p);});
  var riskMsg=atRisk.length?('<div class="warnbar red">⚠ '+atRisk.length+' projekt'+(atRisk.length===1?"as":"ai")+' gali nespėti iki termino (liko daugiau darbo nei laiko): '+atRisk.map(function(p){return "Nr. "+esc(p.id);}).join(", ")+'</div>'):'';
  return '<div class="section"><div class="sec-bar"><span class="eyebrow">Skyrių apkrova — parduota darbo</span></div><div class="ptblwrap"><div class="gtbl" style="border:none"><div class="gr th dsum"><span>Skyrius</span><span class="r">Terminas šį mėn.</span><span class="r">Parduota</span><span class="r">Pradirbta</span><span class="r">Liko</span></div>'+body+'</div></div><div class="warnbar '+capTone+'">'+capMsg+'</div>'+riskMsg+'</div>';
}
/* parduotų dalių ir paslaugų bendra suma (komercinio pasiūlymo pajamos) */
function soldTotal(p){return (p.stages||[]).reduce(function(a,s){var v=soldSum(p,s);return a+(v||0);},0);}
function profit(p){
  var contractRev=(p.revenue||[]).reduce(function(a,r){return a+(r.sum||0);},0);
  var fromSold=!(p.revenue&&p.revenue.length); // jei sutarčių neįvesta — pajamos iš parduotų dalių/paslaugų
  var rev=fromSold?soldTotal(p):contractRev;
  var sub=(p.subrangai||[]).reduce(function(a,r){return a+(r.sum||0);},0);
  var emp=p.stages.reduce(function(a,s){return a+stageCost(p,s);},0);
  return {rev:rev,sub:sub,emp:emp,profit:rev-sub-emp,fromSold:fromSold};}
function deadlineChip(p){if(p.status==="closed")return {tone:"grey",txt:"uždarytas"};if(!p.deadline)return {tone:"grey",txt:"—"};var d=daysBetween(today,p.deadline);var tone=d<0?"red":d<=7?"amber":"green";var txt=d<0?(Math.abs(d)+" d. pradelsta"):d===0?"šiandien":("liko "+d+" d.");return {tone:tone,txt:txt};}
function barCls(sp,pl){return sp>pl?"over":(pl&&sp>=pl?"done":"wip");}
function projById(id){return PROJECTS.find(function(p){return p.id===id;});}
function selProject(){return projById(state.selId);}
function myStages(){var seen={};var meE=(state.meEmail||"").trim().toLowerCase(),meN=state.me;
  return PROJECTS.filter(function(p){return p.status!=="closed";}).reduce(function(a,p){p.stages.forEach(function(s){
    var mine=(s.pris||[]).find(function(pr){return (pr.email||"").trim().toLowerCase()===meE || pr.name===meN;});
    if(!mine && s.resp===meN) mine={hours:0}; // atsarginis senas „resp" susiejimas
    if(mine){var k=p.id+"|"+s.code;if(seen[k])return;seen[k]=1;a.push({p:p,s:s,myHours:mine.hours||0});}
  });return a;},[]);}
function myDayHours(pid,code,date){return state.regs.reduce(function(a,r){return a+((r.who===state.me&&r.pid===pid&&r.code===code&&r.date===date)?r.hours:0);},0);}
function myStageSpent(pid,code){return state.regs.reduce(function(a,r){return a+((r.who===state.me&&r.pid===pid&&r.code===code)?r.hours:0);},0);}
function personOptions(sel){return PEOPLE.filter(function(p){return p.inProjects||p.name===sel;}).map(function(p){return '<option value="'+esc(p.name)+'"'+(p.name===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");}
function skyriusOptions(sel){return '<option value="">— pasirink dalį —</option>'+SKYRIAI.map(function(s){return '<option value="'+esc(s.code)+'"'+(s.code===sel?" selected":"")+'>'+esc(s.code)+' — '+esc(s.name)+'</option>';}).join("");}
/* PV pasirinkimas: PV ir Admin rolės žmonės (value=el. paštas); visada įtraukiamas pažymėtasis */
function pmOptions(selEmail){selEmail=(selEmail||"").toLowerCase();
  var list=PEOPLE.filter(function(p){return p.role==="PV"||p.role==="ADMIN";});
  if(selEmail&&!list.some(function(p){return p.email===selEmail;})){var pe=personByEmail(selEmail);list=list.concat([{email:selEmail,name:pe?pe.name:nameOf(selEmail)}]);}
  return list.map(function(p){return '<option value="'+esc(p.email)+'"'+(p.email===selEmail?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");}
/* kainos įvedimo sekcija: bendra suma ARBA val. įkainis × parduotos valandos */
/* Dalies pardavimas: dviem būdais — „Bendra suma" (tik suma + terminas) arba
   „Dienos × įkainis" (parduotos dienos × dienos įkainis → bendra suma apskaičiuojama). */
function priceSectionHtml(pfx,mode,price,rate,days,defRate){
  var isDays = mode==="days";
  var seg='<div class="statseg" style="margin-bottom:8px"><button class="segbtn'+(!isDays?" on":"")+'" data-act="pricemode" data-m="sum">Bendra suma</button><button class="segbtn'+(isDays?" on":"")+'" data-act="pricemode" data-m="days">Dienos × įkainis</button></div>';
  var body;
  if(isDays){
    var dn=Number(days)||0, rn=(rate!=null&&rate!=="")?Number(rate):(Number(defRate)||0);
    var calc=(rn>0&&dn>0)?nf(dn*rn)+" €":"— €";
    body='<div class="two"><label class="field" style="margin:0"><span class="eyebrow">Parduotos dienos</span><input class="inp" id="'+pfx+'-days" type="number" min="0" step="0.5" placeholder="0" value="'+esc(days!=null&&days!==""?days:"")+'"></label>'+
         '<label class="field" style="margin:0"><span class="eyebrow">Dienos įkainis, €</span><input class="inp" id="'+pfx+'-rate" type="number" min="0" step="0.01" value="'+esc(rate!=null&&rate!==""?rate:(defRate!=null?defRate:""))+'"></label></div>'+
         '<div class="muted" style="font-size:12px;margin-top:5px">Bendra suma: <b id="'+pfx+'-calc">'+calc+'</b></div>';
  } else {
    body='<input class="inp" id="'+pfx+'-price" type="number" min="0" step="0.01" placeholder="Parduota suma, € (nebūtina)" value="'+esc(price!=null&&price!==""?price:"")+'">';
  }
  return '<div class="field"><span class="eyebrow">Pardavimas</span>'+seg+body+'</div>';
}
/* iš kainos modalo laukų nuskaito {days, price, rate}. Bendra-suma režime days=0;
   dienų režime price = dienos × įkainis. */
function readSale(pfx,mode,defRate){
  if(mode==="days"){
    var d=Number((document.getElementById(pfx+"-days")||{}).value)||0;
    var rv=(document.getElementById(pfx+"-rate")||{}).value;
    var r=(rv===""||rv==null)?(Number(defRate)||0):Number(rv);
    return {days:d, rate:r, price:(d>0&&r>0)?d*r:(d>0?0:null)};
  }
  var pv=(document.getElementById(pfx+"-price")||{}).value;
  return {days:0, rate:null, price:(pv===""||pv==null)?null:Number(pv)};
}
function loadClass(v){return v<=0?"l0":v<=4?"l1":v<=CAP?"l2":"l3";}

function projectGroups(list){
  if(state.sortBy==="nr"){ return [{key:"nr:all",label:"Visi projektai (pagal Nr.)",tone:"grey",items:list}]; }
  if(state.sortBy==="pv"){
    var g={},order=[];list.forEach(function(p){var k=pmName(p);if(!g[k]){g[k]=[];order.push(k);}g[k].push(p);});
    order.sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1;});
    return order.map(function(k){return {key:"pv:"+k,label:"PV: "+k,tone:"blue",items:g[k]};});
  }
  var defs=[{key:"od",label:"Pradelsti",tone:"red",t:function(d){return d!==null&&d<0;}},
            {key:"wk",label:"Šią savaitę",tone:"amber",t:function(d){return d!==null&&d>=0&&d<=7;}},
            {key:"mo",label:"Šį mėnesį",tone:"green",t:function(d){return d!==null&&d>7&&d<=31;}},
            {key:"later",label:"Vėliau",tone:"blue",t:function(d){return d!==null&&d>31;}},
            {key:"none",label:"Be termino",tone:"grey",t:function(d){return d===null;}}];
  var res=defs.map(function(b){return {key:b.key,label:b.label,tone:b.tone,items:[]};});
  list.forEach(function(p){var d=p.deadline?daysBetween(today,p.deadline):null;for(var i=0;i<defs.length;i++){if(defs[i].t(d)){res[i].items.push(p);break;}}});

/* =========================== RENDER =========================== */
function render(){
  var app=document.getElementById("app");
  if(state.phase==="login"){
    app.innerHTML='<div class="gate"><div class="gate-card"><div class="gate-mark">'+IC.gauge+'</div><h1>PROJEKTŲ CENTRAS</h1><p>Projektų ir laiko sekimo sistema. Prisijunk savo įmonės Microsoft paskyra.</p><button class="msbtn" data-act="signin">'+IC.ms+' Prisijungti su Microsoft</button>'+(state.err?'<div class="gate-note" style="color:#9c2c1f">'+esc(state.err)+'</div>':'')+'<div class="gate-note">UAB „Projektų centras" · saugus prisijungimas per „Microsoft Entra ID"</div></div></div>';
    return;
  }
  if(state.phase==="boot"||state.phase==="loading"){
    app.innerHTML='<div class="gate"><div class="gate-card"><div class="spin"></div><p style="margin-top:14px">'+(state.phase==="loading"?"Kraunami duomenys iš SharePoint…":"Jungiamasi…")+'</p></div></div>';
    return;
  }
  if(state.phase==="fatal"){
    app.innerHTML='<div class="gate"><div class="gate-card"><div class="gate-mark" style="background:var(--red)">'+IC.warn+'</div><h1>Nepavyko įkelti</h1><p style="text-align:left">'+esc(state.err||"")+'</p><button class="msbtn" data-act="signout" style="background:var(--blue)">Bandyti iš naujo</button></div></div>';
    return;
  }
  if(state.phase==="noaccess"){
    app.innerHTML='<div class="gate"><div class="gate-card"><div class="gate-mark" style="background:var(--steel-500)">'+IC.gauge+'</div><h1>Prieiga nesuteikta</h1><p>Jūsų paskyra <code>'+esc(state.meEmail||"")+'</code> nėra registruota sistemoje. Kreipkitės į IT skyrių, kad Jus įtrauktų.</p><button class="msbtn" data-act="signout" style="background:var(--blue)">Atsijungti</button></div></div>';
    return;
  }
  var role=myRole(),tabs=myTabs();
  if(!tabs.some(function(t){return t[0]===state.tab;})){state.tab=tabs[0][0];state.view=(state.tab==="projektai"?"list":state.tab);}

  var warnBanner=state.warn?'<div class="banner warn">'+IC.warn+'<div>'+state.warn+'</div></div>':'';

/* =========================== SAVE HELPERS (SharePoint REST) =========================== */
function busy(on){state.saving=on;render();}
async function withSave(fn){ busy(true); try{ await fn(); }catch(e){ alert("Nepavyko išsaugoti:\n"+e.message); }finally{ busy(false);} }
var L=CONFIG.lists;

async function saveCell(){
  var m=state.modal,h=Number(document.getElementById("cell-h").value)||0;
  state.modal=null;
  await withSave(async function(){
    var dups=state.regs.filter(function(r){return r.who===state.me&&r.pid===m.pid&&r.code===m.code&&r.date===m.date;});
    for(var i=0;i<dups.length;i++){ if(dups[i].spId) await delItem(L.darboLaikas,dups[i].spId); }
    state.regs=state.regs.filter(function(r){return !(r.who===state.me&&r.pid===m.pid&&r.code===m.code&&r.date===m.date);});
    if(h>0){ var res=await addItem(L.darboLaikas,{Title:m.pid,ProjektoNr:m.pid,SkyriausKodas:m.code,DarbuotojoElPastas:state.meEmail,Data:m.date,Valandos:h});
      state.regs.push({who:state.me,whoEmail:state.meEmail,pid:m.pid,code:m.code,date:m.date,hours:h,spId:res.id}); }
  });
}
async function clearCell(){ var m=state.modal;state.modal=null;

var _scrimDown=false;
document.addEventListener("mousedown",function(e){_scrimDown=!!(e.target.classList&&e.target.classList.contains("scrim"));});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-tab],[data-x]");
  if(_scrimDown&&e.target.classList&&e.target.classList.contains("scrim")){_scrimDown=false;state.modal=null;state.draft=null;render();return;}
  _scrimDown=false;
  if(!el)return;
  if(el.hasAttribute("data-x")){state.modal=null;state.draft=null;render();return;}
  if(el.hasAttribute("data-tab")){var tb=el.getAttribute("data-tab");state.tab=tb;state.view=(tb==="projektai"?"list":tb);render();return;}
  var a=el.getAttribute("data-act");
  if(a==="signin"){doLogin();}
  else if(a==="signout"){msalApp.logoutRedirect();}
  else if(a==="open"){state.selId=el.getAttribute("data-id");state.view="detail";state.tab="projektai";render();}
  else if(a==="back"){state.view="list";state.tab="projektai";render();}
  else if(a==="closeproj"){setStatus("closed");}
  else if(a==="reopen"){setStatus("active");}
  else if(a==="delproject"){deleteProject();}
  else if(a==="togglesort"){state.sortBy=(state.sortBy==="deadline"?"pv":state.sortBy==="pv"?"nr":"deadline");render();}
  else if(a==="togglegroup"){var gk=el.getAttribute("data-g");state.collapsed[gk]=!state.collapsed[gk];render();}
  else if(a==="statview"){state.statView=el.getAttribute("data-v");render();}
  else if(a==="tsprev"){state.tsOff--;render();}
  else if(a==="tsnext"){state.tsOff++;render();}
  else if(a==="tsnow"){state.tsOff=0;render();}
  else if(a==="addtask"){state.modal={type:"task"};render();}
  else if(a==="deltask"){delTask(el.getAttribute("data-sp"));}
  else if(a==="savetask"){saveTask();}
  else if(a==="addstage"){state.modal={type:"stage",kind:"dept",priceMode:"days",code:"",days:"",due:"",price:"",rate:"",sub:false};render();}
  else if(a==="savestage"){saveStage();}
  else if(a==="stage-kind"){var mm=state.modal;if(mm){var dE=document.getElementById("sg-days");if(dE)mm.days=dE.value;var uE=document.getElementById("sg-due");if(uE)mm.due=uE.value;var pE=document.getElementById("sg-price");if(pE)mm.price=pE.value;var rE=document.getElementById("sg-rate");if(rE)mm.rate=rE.value;var bE=document.getElementById("sg-sub");if(bE)mm.sub=bE.checked;mm.kind=el.getAttribute("data-k")==="svc"?"svc":"dept";if(mm.kind==="svc")mm.sub=false;mm.code="";render();}}
  else if(a==="editstage"){var ec=el.getAttribute("data-code");var est=(selProject().stages||[]).find(function(s){return s.code===ec;})||{};
    var hasDays=(est.soldDays||0)>0;var mode=hasDays?"days":(est.soldPrice!=null?"sum":"days");
    var inferRate=(hasDays&&est.soldPrice!=null)?(Math.round((est.soldPrice/est.soldDays)*100)/100):skyriusRate(ec);
    state.modal={type:"stageedit",code:ec,svc:isSvc(ec),sub:!!est.sub,priceMode:mode,days:(est.soldDays!=null?est.soldDays:""),due:est.deadline||"",price:(est.soldPrice!=null?est.soldPrice:""),rate:(mode==="days"?inferRate:"")};render();}
  else if(a==="pricemode"){var mm=state.modal;if(mm){var pfx=mm.type==="stage"?"sg":"se";var dE=document.getElementById(pfx+"-days");if(dE)mm.days=dE.value;var uE=document.getElementById(pfx+"-due");if(uE)mm.due=uE.value;var cE=document.getElementById("sg-code");if(cE)mm.code=cE.value;var nE=document.getElementById("sg-name");if(nE)mm.code=nE.value;var pE=document.getElementById(pfx+"-price");if(pE)mm.price=pE.value;var rE=document.getElementById(pfx+"-rate");if(rE)mm.rate=rE.value;var bE=document.getElementById(pfx+"-sub");if(bE)mm.sub=bE.checked;mm.priceMode=el.getAttribute("data-m");render();}}
  else if(a==="savestageedit"){saveStageEdit();}
  else if(a==="editpm"){state.modal={type:"pmedit"};render();}
  else if(a==="savepm"){savePm();}
  else if(a==="editproj"){state.modal={type:"projedit"};render();}
  else if(a==="saveproj"){saveProjEdit();}
  else if(a==="taskdone"){toggleTaskDone(el.getAttribute("data-sp"));}
  else if(a==="assign"){state.modal={type:"assign",pid:el.getAttribute("data-pid"),code:el.getAttribute("data-code"),email:el.getAttribute("data-email")||""};render();}
  else if(a==="assign-all"){var di=document.getElementById("as-days");if(di){di.value=el.getAttribute("data-d");di.focus();}}
  else if(a==="saveassign"){saveAssign();}
  else if(a==="unassign"){unassign(el.getAttribute("data-sp"));}
  else if(a==="edittask"){state.modal={type:"taskedit",sp:el.getAttribute("data-sp")};render();}
  else if(a==="savetaskedit"){saveTaskEdit(el.getAttribute("data-sp"));}
  else if(a==="addemp"){state.modal={type:"empedit",sp:""};render();}
  else if(a==="editemp"){state.modal={type:"empedit",sp:el.getAttribute("data-sp")};render();}
  else if(a==="saveemp"){saveEmp(el.getAttribute("data-sp"));}
  else if(a==="delemp"){delEmp(el.getAttribute("data-sp"));}
  else if(a==="addteam"){state.modal={type:"teamedit",sp:""};render();}
  else if(a==="editteam"){state.modal={type:"teamedit",sp:el.getAttribute("data-sp")};render();}
  else if(a==="saveteam"){saveTeam(el.getAttribute("data-sp"));}
  else if(a==="cell"){state.modal={type:"cell",pid:el.getAttribute("data-pid"),code:el.getAttribute("data-code"),date:el.getAttribute("data-date")};render();}
  else if(a==="savecell"){saveCell();}
  else if(a==="clearcell"){clearCell();}
  else if(a==="setabs"){setAbsence(el.getAttribute("data-date"),el.getAttribute("data-t"));}
  else if(a==="clearabs"){clearAbsence(el.getAttribute("data-date"));}
  else if(a==="clearfilters"){state.fFrom="";state.fTo="";state.fUser="all";state.fProj="all";render();}
  else if(a==="addrev"){state.modal={type:"rev"};render();}
  else if(a==="addsub"){state.modal={type:"sub"};render();}
  else if(a==="saverev"){saveRevSub(true);}
  else if(a==="savesub"){saveRevSub(false);}
  else if(a==="delrev"){delRevSub(true,el.getAttribute("data-sp"));}
  else if(a==="delsub"){delRevSub(false,el.getAttribute("data-sp"));}
  else if(a==="newproject"){state.draft={id:"",name:"",deadline:iso(30),pm:state.meEmail,stages:[{kind:"dept",code:"",days:"",due:"",sum:""}]};state.modal={type:"newproject"};render();}
  else if(a==="draft-addstage"){snapshotDraft();state.draft.stages.push({kind:"dept",code:"",days:"",due:"",sum:""});render();}
  else if(a==="draft-addsvc"){snapshotDraft();state.draft.stages.push({kind:"svc",code:"",days:"",due:"",sum:""});render();}
  else if(a==="draft-kind"){snapshotDraft();var di=Number(el.getAttribute("data-i"));if(state.draft.stages[di]){state.draft.stages[di].kind=el.getAttribute("data-k")==="svc"?"svc":"dept";state.draft.stages[di].code="";}render();}
  else if(a==="draft-delstage"){snapshotDraft();state.draft.stages.splice(Number(el.getAttribute("data-i")),1);if(!state.draft.stages.length)state.draft.stages.push({kind:"dept",code:"",days:"",due:"",sum:""});render();}
  else if(a==="create"){createProject();}
});
document.addEventListener("input",function(e){var id=e.target.id||"";
  if(id==="proj-q"){state.q=e.target.value;state._qfocus=true;render();return;}
  if(id==="sg-rate"||id==="sg-days"||id==="se-rate"||id==="se-days"){
    var pfx=id.indexOf("sg-")===0?"sg":"se";
    var days=Number((document.getElementById(pfx+"-days")||{}).value)||0;
    var rate=Number((document.getElementById(pfx+"-rate")||{}).value)||0;
    var calc=document.getElementById(pfx+"-calc"); if(calc)calc.textContent=(rate>0&&days>0)?nf(days*rate)+" €":"— €";
  }
});
document.addEventListener("change",function(e){var id=e.target.id,v=e.target.value;
  if(id==="status-filter"){state.fStatus=v;render();}
  else if(id==="f-pel"){state.pelId=v;render();}
  else if(id==="f-from"){state.fFrom=v;render();}
  else if(id==="f-to"){state.fTo=v;render();}
  else if(id==="f-user"){state.fUser=v;render();}
  else if(id==="f-proj"){state.fProj=v;render();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.id==="cell-h"){e.preventDefault();saveCell();}
});

/* =========================== BOOT / AUTH =========================== */
async function doLogin(){
  if(authBusy) return;                 // jau vyksta prisijungimas — nekartojam
  authBusy=true;
  var request={scopes:LOGIN_SCOPES};
  try{
    if(IS_MOBILE){ await msalApp.loginRedirect(request); return; }
    var resp=await msalApp.loginPopup(request);
    account=resp.account; msalApp.setActiveAccount(account);
    await afterLogin();
  }catch(e){
    if(["block_nested_popups","popup_window_error","empty_window_error"].indexOf(e.errorCode)>=0){ try{ await msalApp.loginRedirect(request); }catch(e2){ state.err="Prisijungti nepavyko: "+e2.message; render(); } }
    else if(e.errorCode==="interaction_in_progress"){ state.err="Prisijungimas jau vykdomas. Palaukite kelias sekundes arba perkraukite puslapį (F5) ir bandykite dar kartą."; render(); }
    else if(e.errorCode!=="user_cancelled"){ state.err="Prisijungti nepavyko: "+e.message; render(); }
  }finally{ authBusy=false; }
}
async function afterLogin(){
  state.meEmail=(account.username||"").toLowerCase();
  state.meName=account.name;
  await loadEverything();
}

async function loadEverything(){
  state.phase="loading"; render();
  try{
    var names=CONFIG.lists;
    var res=await Promise.all([
      listItems(names.darbuotojai), listItems(names.skyriai), listItems(names.projektai),
      listItems(names.dalys), listItems(names.priskyrimai), listItems(names.darboLaikas),
      listItems(names.uzduotys), listItems(names.sutartys), listItems(names.subrangai),
      listItems(names.nebuvimai).catch(function(){return [];})
    ]);
    assemble({darbuotojai:res[0],skyriai:res[1],projektai:res[2],dalys:res[3],priskyrimai:res[4],darboLaikas:res[5],uzduotys:res[6],sutartys:res[7],subrangai:res[8],nebuvimai:res[9]||[]});
    var me=personByEmail(state.meEmail);
    if(!me){ state.phase="noaccess"; render(); return; }
    state.me=me.name;
    if(PROJECTS.length){ state.selId=PROJECTS[0].id; state.pelId=PROJECTS[0].id; }
    state.phase="app"; state.view="list"; state.tab="projektai"; render();
  }catch(e){
    state.phase="fatal";
    state.err="Nepavyko pasiekti SharePoint duomenų.\n\n"+e.message+"\n\nDažniausios priežastys: (1) sąrašai dar nesukurti arba kitaip pavadinti nei "+Object.keys(CONFIG.lists).length+" laukiami; (2) šio talpinimo adresas nepridėtas prie programos registracijos redirect URI; (3) neturi teisių į svetainę "+SP_SITE_URL+".";
    render();
  }
}

(async function init(){
  try{
    await msalApp.initialize();
    var resp=await msalApp.handleRedirectPromise();
    if(resp&&resp.account){ account=resp.account; }
    else { var accs=msalApp.getAllAccounts(); if(accs.length) account=accs[0]; }
    if(!account){ state.phase="login"; render(); return; }
    msalApp.setActiveAccount(account);
    await afterLogin();
  }catch(e){ state.phase="login"; state.err=e.message; render(); }
})();
</script>
